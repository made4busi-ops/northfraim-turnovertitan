<!DOCTYPE html>
<html>
<head><title>Turnover Titans</title></head>
<body>
    <h1>Turnover Titans</h1>
    <video controls playsinline poster="" style="width:100%;max-width:640px;display:block;margin-bottom:1.5rem;background:#000;">
        <source src="media/promo.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>
    <form action="/submit" method="POST" onsubmit="var b=this.querySelector('button'); b.disabled=true; b.innerText='Submitting\u2026 (this can take a few seconds)';">
        <label>Name:</label><input type="text" name="name" required><br><br>
        <label>Business:</label><input type="text" name="business" required><br><br>
        <label>Message:</label><textarea name="message"></textarea><br><br>
        <button type="submit">Submit</button>
    </form>
</body>
</html>
